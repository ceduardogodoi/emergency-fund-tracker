# From Home to the reminders screen, through the navigation menu, waiting until the stored
# setting has been read. A subflow because Story 6's journey makes the trip four times;
# named outside `us*.yaml` so `e2e/config.yaml` does not run it as a journey of its own, as
# with `open-app.yaml`.
appId: ${APP_ID}
---
- runFlow:
    file: go-to-section.yaml
    env:
      ITEM: 'menu-item-reminders'
- extendedWaitUntil:
    visible:
      id: 'reminder-enabled'
    timeout: 20000
