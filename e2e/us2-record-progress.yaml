# User Story 2 — record savings, and see where the fund stands.
#
# The story's Independent Test, on a device: an opening balance entered during setup counts
# toward the fund from the first screen (FR-010), each contribution moves the balance on the
# screen the user returns to (FR-008, FR-012, FR-013), the history lists them all (FR-014),
# one is corrected and another deleted from there (FR-011), and what is left survives a
# restart.
#
# Runs inside Expo Go; see `us1-set-target.yaml` for why, for why `APP_ID` and `DEV_URL` come
# from the npm scripts rather than an `env:` block here, and for why amounts are matched by
# their digits alone.
appId: ${APP_ID}
name: US2 — record progress
---
- clearState
- runFlow: open-app.yaml

# The target, as briefly as it can be set: `us1-set-target.yaml` owns that journey.
- extendedWaitUntil:
    visible:
      id: 'expenses-input'
    timeout: 30000
- tapOn:
    id: 'expenses-input'
- inputText: '200000'
- tapOn:
    id: 'continue'
- extendedWaitUntil:
    visible:
      id: 'level-balanced'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'save-goal'
    direction: DOWN
- tapOn:
    id: 'save-goal'

# FR-010 — what was saved before the app was. R$ 3.000,00 against a target of R$ 12.000,00.
- extendedWaitUntil:
    visible:
      id: 'opening-input'
    timeout: 20000
- tapOn:
    id: 'opening-input'
- inputText: '300000'
# The number pad is put away before the save control is tapped; see `us1-set-target.yaml`
# for why the drag starts where it does.
- swipe:
    start: 50%, 32%
    end: 50%, 22%
- scrollUntilVisible:
    element:
      id: 'save-opening'
    direction: DOWN
- tapOn:
    id: 'save-opening'

# Home, with the opening balance already counted.
- extendedWaitUntil:
    visible:
      id: 'standing-card'
    timeout: 20000
- assertVisible:
    id: 'balance-amount'
    text: '.*3[.,]000[.,]00.*'

# FR-008 — a contribution, dated today, which is what the form opens on.
- tapOn:
    id: 'contribute'
- extendedWaitUntil:
    visible:
      id: 'amount-input'
    timeout: 20000
- tapOn:
    id: 'amount-input'
- inputText: '50000'
- swipe:
    start: 50%, 32%
    end: 50%, 22%
- scrollUntilVisible:
    element:
      id: 'save-entry'
    direction: DOWN
- tapOn:
    id: 'save-entry'

# FR-012, FR-013 — back on Home, which was mounted with the old balance and has to show
# the new one.
- extendedWaitUntil:
    visible:
      id: 'standing-card'
    timeout: 20000
- assertVisible:
    id: 'balance-amount'
    text: '.*3[.,]500[.,]00.*'

# A second contribution, so that one can be corrected and the other deleted.
- tapOn:
    id: 'contribute'
- extendedWaitUntil:
    visible:
      id: 'amount-input'
    timeout: 20000
- tapOn:
    id: 'amount-input'
- inputText: '25000'
- swipe:
    start: 50%, 32%
    end: 50%, 22%
- scrollUntilVisible:
    element:
      id: 'save-entry'
    direction: DOWN
- tapOn:
    id: 'save-entry'
- extendedWaitUntil:
    visible:
      id: 'standing-card'
    timeout: 20000
- assertVisible:
    id: 'balance-amount'
    text: '.*3[.,]750[.,]00.*'

# FR-014 — the history lists all three, each as what it is. Matched by text alone, with no
# id: a row is one accessible element, so iOS exposes it as a single node carrying
# everything in it, while Android exposes the texts inside it. A contribution's pattern
# insists on its sign, because without it `500,00` is also the tail of a balance.
- tapOn:
    id: 'history'
- extendedWaitUntil:
    visible:
      id: 'history-list'
    timeout: 20000
- assertVisible: '.*\+ \D*500[.,]00.*'
- assertVisible: '.*\+ \D*250[.,]00.*'
- assertVisible: '.*3[.,]000[.,]00.*'

# FR-011 — a correction. R$ 500,00 becomes R$ 700,00. The field opens on the stored amount,
# so that is erased first: the digits typed are appended to whatever is there.
- tapOn: '.*\+ \D*500[.,]00.*'
- extendedWaitUntil:
    visible:
      id: 'amount-input'
    timeout: 20000
- tapOn:
    id: 'amount-input'
- eraseText
- inputText: '70000'
- swipe:
    start: 50%, 32%
    end: 50%, 22%
- scrollUntilVisible:
    element:
      id: 'save-entry'
    direction: DOWN
- tapOn:
    id: 'save-entry'

# Back in the history, which was mounted with the old amount and has to show the new one.
- extendedWaitUntil:
    visible:
      id: 'history-list'
    timeout: 20000
- assertVisible: '.*\+ \D*700[.,]00.*'
- assertNotVisible: '.*\+ \D*500[.,]00.*'

# FR-011 — a deletion, which asks first. The sheet's action is the bare verb; the button
# that opened it names what it deletes, so the two cannot be mistaken for each other here.
- tapOn: '.*\+ \D*250[.,]00.*'
- extendedWaitUntil:
    visible:
      id: 'amount-input'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'delete-entry'
    direction: DOWN
- tapOn:
    id: 'delete-entry'
- extendedWaitUntil:
    visible:
      id: 'delete-sheet'
    timeout: 10000
- tapOn: 'Excluir'
- extendedWaitUntil:
    visible:
      id: 'history-list'
    timeout: 20000
- assertNotVisible: '.*\+ \D*250[.,]00.*'
- assertVisible: '.*\+ \D*700[.,]00.*'

# What is left is in storage, not only in the cache: the opening balance and the corrected
# contribution, and nothing of the deleted one. Restarted from the history rather than from
# Home: Maestro's `back` is Android's, and the restart lands on Home either way.
- stopApp
- runFlow: open-app.yaml
- extendedWaitUntil:
    visible:
      id: 'standing-card'
    timeout: 60000
- assertVisible:
    id: 'balance-amount'
    text: '.*3[.,]700[.,]00.*'
