# Maestro smoke flow. Proves the app launches and renders before any journey flow runs.
#
# Install Maestro: curl -Ls "https://get.maestro.mobile.dev" | bash
# Requires `npx expo start`: the app runs inside Expo Go, so the flow opens the dev
# server's link rather than launching a package of our own.
appId: ${APP_ID}
name: smoke — the app launches
---
- clearState
- runFlow: open-app.yaml
