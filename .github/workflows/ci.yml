name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Node version comes from .tool-versions — the same file developer
      # machines resolve through asdf, so a local/CI version mismatch is not
      # possible. setup-node reads that file directly rather than installing
      # asdf here: asdf 0.16 became a Go binary, and the install action still
      # expects the shell script that a clone used to provide.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci

      # The same command the pre-commit hook runs, so the gate is defined in one
      # place and cannot drift. Warnings are errors.
      - run: npm run verify
